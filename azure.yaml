name: azd-global-secure-access
metadata:
  template: azd-global-secure-access@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

hooks:
  preprovision:
    shell: pwsh
    run: ./scripts/Invoke-PreProvision.ps1
    interactive: true
    continueOnError: false
  postprovision:
    shell: pwsh
    run: ./scripts/Invoke-PostProvision.ps1
    interactive: true
    continueOnError: false
