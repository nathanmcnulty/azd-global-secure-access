name: azd-global-secure-access
metadata:
  template: azd-global-secure-access@0.3.0

requiredVersions:
  azd: ">= 1.30.0"

infra:
  provider: bicep
  path: infra
  module: main

hooks:
  preprovision:
    shell: pwsh
    run: ./scripts/Invoke-PreProvision.ps1
    interactive: true
    continueOnError: false
  postprovision:
    shell: pwsh
    run: ./scripts/Invoke-PostProvision.ps1
    interactive: true
    continueOnError: false
  predown:
    shell: pwsh
    run: ./scripts/Invoke-PreDown.ps1
    interactive: true
    continueOnError: false
