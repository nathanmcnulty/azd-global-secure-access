name: Validate template

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0
        with:
          version: 1.30.0

      - name: Select PowerShell 7.6.6
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/powershell-7.6.6"
          archive="$RUNNER_TEMP/powershell-7.6.6-linux-x64.tar.gz"
          mkdir "$runtime"
          curl --fail --location --output "$archive" 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/powershell-7.6.6-linux-x64.tar.gz'
          echo "ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$runtime"
          chmod +x "$runtime/pwsh"
          echo "$runtime" >> "$GITHUB_PATH"

      - name: Assert selected PowerShell runtime
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -ne [version]'7.6.6' -or -not [Environment]::Is64BitProcess) {
            throw "Expected 64-bit PowerShell 7.6.6; observed $($PSVersionTable.PSVersion)."
          }

      - name: Install PowerShell test modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Load azd template
        run: |
          azd env new ci-validation --no-prompt
          azd env set GSA_ORGANIZATION_NAME "CI Validation" -e ci-validation
          azd env get-values -e ci-validation > /dev/null

      - name: Build Bicep
        run: az bicep build --file ./infra/main.bicep --stdout > /dev/null

      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $findings = @(Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error,Warning)
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }

      - name: Audit packaged samples and fixtures
        shell: pwsh
        run: |
          $files = @(Get-ChildItem ./samples, ./tests/fixtures -Recurse -File -ErrorAction Stop)
          $patterns = @(
            '-----BEGIN [A-Z ]*PRIVATE KEY-----',
            '(?i)bearer\s+eyJ',
            '(?i)client[_-]?secret\s*[:=]\s*["'']?[^"''\s]+',
            '(?i)pre.?shared.?key',
            '(?i)(^|[^a-z])psk([^a-z]|$)'
          )
          foreach ($file in $files) {
            $content = Get-Content $file.FullName -Raw
            foreach ($pattern in $patterns) {
              if ($content -match $pattern) {
                throw "Packaged sample or fixture contains prohibited secret-shaped content: $($file.FullName)"
              }
            }
          }

      - name: Run Pester
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 6.2.0 -Force
          $result = Invoke-Pester ./tests -PassThru -Output Detailed
          if ($result.Result -ne 'Passed' -or $result.TotalCount -eq 0 -or $result.SkippedCount -or $result.InconclusiveCount -or $result.NotRunCount) {
            throw 'Every registered Pester test must pass without skipped, inconclusive or unexecuted cases.'
          }
